# Legacy residual finance log files only. Reviewed systemd units (finance-dashboard,
# actual-sync, finance-event-sync, finance-sync-failure@) log to the user journal.
# See ops/lib/logrotate-contract.json and ops/README.md § Log rotation.
/home/dark/actual/bank-sync.log /home/dark/actual-tools/*.log {
    daily
    rotate 14
    maxsize 5M
    su dark dark
    compress
    delaycompress
    missingok
    notifempty
    create 0600 dark dark
}
