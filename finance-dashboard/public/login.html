<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — DarkFinances</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --border: rgba(255,255,255,0.07);
      --text: #f0f0f5; --muted: #6b6b80; --accent: #7c6ef7; --accent-light: #a898ff;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 2rem; }
    .logo span { color: var(--accent-light); }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--muted); margin-bottom: 2rem; }
    .passkey-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.15s;
    }
    .passkey-btn:hover { opacity: 0.9; }
    .passkey-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .passkey-icon { font-size: 18px; }
    .status {
      margin-top: 1rem;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }
    .status.error { color: #f87171; }
    .status.success { color: #4ade80; }
    .register-link {
      margin-top: 1.5rem;
      font-size: 12px;
      color: var(--muted);
    }
    .register-link a {
      color: var(--accent-light);
      cursor: pointer;
      text-decoration: none;
    }
    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">dark<span>finances</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in with your passkey</p>
    <button class="passkey-btn" id="signInBtn" onclick="signIn()">
      <span class="passkey-icon">🔑</span>
      Sign in with passkey
    </button>
    <div class="status" id="status"></div>
  </div>

  <script>
    function b64url(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }
    function fromB64url(str) {
      const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(base64);
      return Uint8Array.from(bin, c => c.charCodeAt(0));
    }

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    async function signIn() {
      const btn = document.getElementById('signInBtn');
      btn.disabled = true;
      setStatus('Waiting for passkey...');
      try {
        const optRes = await fetch('/auth/login/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const options = await optRes.json();
        options.challenge = fromB64url(options.challenge);
        if (options.allowCredentials) {
          options.allowCredentials = options.allowCredentials.map(c => ({ ...c, id: fromB64url(c.id) }));
        }
        const cred = await navigator.credentials.get({ publicKey: options });
        const payload = {
          id: cred.id,
          rawId: b64url(cred.rawId),
          type: cred.type,
          response: {
            authenticatorData: b64url(cred.response.authenticatorData),
            clientDataJSON: b64url(cred.response.clientDataJSON),
            signature: b64url(cred.response.signature),
            userHandle: cred.response.userHandle ? b64url(cred.response.userHandle) : null,
          },
        };
        const verRes = await fetch('/auth/login/finish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const result = await verRes.json();
        if (result.ok) {
          setStatus('Signing in...', 'success');
          window.location.href = '/';
        } else {
          setStatus(result.error || 'Authentication failed', 'error');
        }
      } catch (e) {
        if (e.name === 'NotAllowedError') setStatus('Cancelled', '');
        else setStatus(e.message, 'error');
      }
      btn.disabled = false;
    }

    async function register() {
      const btn = document.getElementById('signInBtn');
      btn.disabled = true;
      setStatus('Setting up passkey...');
      try {
        const optRes = await fetch('/auth/register/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const options = await optRes.json();
        options.challenge = fromB64url(options.challenge);
        options.user.id = fromB64url(options.user.id);
        if (options.excludeCredentials) {
          options.excludeCredentials = options.excludeCredentials.map(c => ({ ...c, id: fromB64url(c.id) }));
        }
        const cred = await navigator.credentials.create({ publicKey: options });
        const payload = {
          id: cred.id,
          rawId: b64url(cred.rawId),
          type: cred.type,
          response: {
            attestationObject: b64url(cred.response.attestationObject),
            clientDataJSON: b64url(cred.response.clientDataJSON),
            transports: cred.response.getTransports ? cred.response.getTransports() : [],
          },
        };
        const verRes = await fetch('/auth/register/finish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const result = await verRes.json();
        if (result.ok) {
          setStatus('Passkey registered!', 'success');
          window.location.href = '/';
        } else {
          setStatus(result.error || 'Registration failed', 'error');
        }
      } catch (e) {
        if (e.name === 'NotAllowedError') setStatus('Cancelled', '');
        else setStatus(e.message, 'error');
      }
      btn.disabled = false;
    }

    async function init() {
      const res = await fetch('/auth/status');
      const { registered } = await res.json();
      if (!registered) {
        document.getElementById('registerLink').style.display = 'block';
        setStatus('No passkey registered yet — register one below');
      }
    }
    init();
  </script>
</body>
</html>
