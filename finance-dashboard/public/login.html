<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — DarkFinances</title>
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <noscript>
    <div class="noscript-banner">
      Passkey sign-in requires JavaScript. Enable it and reload.
    </div>
  </noscript>
  <div class="card">
    <div class="logo">dark<span>finances</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in with your passkey</p>
    <button class="passkey-btn" id="signInBtn" type="button">
      <span class="passkey-icon">🔑</span>
      Sign in with passkey
    </button>
    <div class="status" id="status"></div>
    <div class="register-link" id="registerLink">
      <a href="#" id="registerBtn">Securely register this device</a>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
