- openLink:
    link: darkfinances:///category/Spending?bucket=spending&start=2026-06-01&end=2026-06-30&label=Jun%202026
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
