appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink:
    link: darkfinances:///bills
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: bills-screen
- assertVisible: Upcoming Bills
- assertVisible:
    id: bills-row-skyline-apartments
    optional: true
- openLink:
    link: darkfinances:///subscriptions
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: subscriptions-screen
- assertVisible:
    id: subscriptions-row-netflix
- tapOn:
    id: subscriptions-row-netflix
- assertVisible:
    id: recurring-detail-screen
- scroll
- assertVisible:
    id: recurring-type-subscription-button
- tapOn:
    id: recurring-type-bill-button
- assertVisible:
    id: recurring-detail-screen
- tapOn:
    id: recurring-type-subscription-button
- scroll
- assertVisible:
    id: recurring-start-cancellation-button
- tapOn:
    id: recurring-start-cancellation-button
- tapOn:
    id: recurring-watch-renewal-button
- scroll
- assertVisible:
    id: recurring-toggle-cancelled-button
- assertVisible:
    id: recurring-hide-button
