appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink: darkfinances:///goals
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: goals-screen
- assertVisible:
    id: goals-row-goal-ef
- tapOn:
    id: goals-row-goal-ef
- assertVisible:
    id: goals-edit-sheet
- waitForAnimationToEnd
- tapOn:
    point: 50%,20%
- tapOn:
    id: goals-add-button
- assertVisible:
    id: goals-edit-sheet
- waitForAnimationToEnd
