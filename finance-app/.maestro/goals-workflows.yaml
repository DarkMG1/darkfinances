appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink:
    link: darkfinances:///goals
- runFlow:
    when:
      visible: 'Open in "Finances"'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: goals-screen
- assertVisible:
    id: goals-row-goal-ef
- tapOn:
    id: goals-row-goal-ef
- assertVisible:
    id: goals-edit-sheet
- tapOn:
    id: goals-edit-sheet-backdrop
- assertNotVisible:
    id: goals-edit-sheet
- tapOn:
    id: goals-add-button
- assertVisible:
    id: goals-edit-sheet
