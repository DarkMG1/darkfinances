appId: ${MAESTRO_APP_ID}
---
# Client validation banner: no retry action; editing a field invalidates/dismisses the banner.
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink: darkfinances:///goals
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: goals-screen
- tapOn:
    id: goals-add-button
- tapOn:
    id: goals-save-button
- assertVisible:
    id: mutation-form-banner
- assertNotVisible:
    id: mutation-form-banner-action
- tapOn:
    id: goals-name-input
- inputText: "Retry draft"
- assertNotVisible:
    id: mutation-form-banner
- assertVisible:
    id: goals-edit-sheet
