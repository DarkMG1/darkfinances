appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- tapOn:
    id: settings-tab
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-notifications-unavailable
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: settings-notifications-unavailable
- assertVisible:
    id: settings-notifications-unavailable-demo-copy
- assertNotVisible:
    id: settings-notif-bills
    optional: true
- assertNotVisible:
    id: settings-notif-weekly
    optional: true
- assertVisible:
    id: settings-screen
