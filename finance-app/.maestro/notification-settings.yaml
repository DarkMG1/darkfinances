appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink: darkfinances:///settings
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-notifications-unavailable
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: settings-notifications-unavailable
- assertVisible: Notification alerts do not run in demo mode
- assertNotVisible:
    id: settings-notif-bills
    optional: true
- assertNotVisible:
    id: settings-notif-weekly
    optional: true
- assertVisible:
    id: settings-screen
