appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink:
    link: darkfinances:///rules
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: rules-screen
- assertVisible:
    id: rules-row-rule-demo-coffee
- openLink:
    link: darkfinances:///events
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: events-screen
- assertVisible:
    id: events-row-cabo
- tapOn:
    id: events-name-input
- inputText: Maestro Trip
- tapOn:
    id: events-members-input
- inputText: alex, sam
- tapOn:
    id: events-group-input
- inputText: Demo Group
- tapOn:
    id: events-create-button
- tapOn:
    text: OK
    optional: true
- assertVisible: Maestro Trip
