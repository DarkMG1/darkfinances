appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- tapOn:
    id: spending-tab
- assertVisible:
    id: spending-screen
- assertNotVisible:
    id: spending-refetch-banner
    optional: true
- assertVisible: Spending
- assertVisible:
    id: spending-period-month-selected
- tapOn:
    id: spending-period-week
- assertVisible:
    id: spending-period-week-selected
- tapOn:
    id: spending-period-quarter
- assertVisible:
    id: spending-period-quarter-selected
- tapOn:
    id: spending-period-year
- assertVisible:
    id: spending-period-year-selected
- tapOn:
    id: spending-period-month
- assertVisible:
    id: spending-period-month-selected
- assertVisible: Income
- assertVisible: Total Spend
- assertNotVisible:
    id: spending-summary-spending-row
- tapOn:
    id: spending-total-row
- assertVisible:
    id: spending-summary-spending-row
- assertVisible:
    id: spending-summary-bills-row
- assertVisible:
    id: spending-summary-subscriptions-row
- assertNotVisible: Gas
- tapOn:
    id: spending-total-row
- assertNotVisible:
    id: spending-summary-spending-row
- tapOn:
    id: spending-total-row
- assertVisible:
    id: spending-summary-spending-row
- takeScreenshot: build/maestro/screenshots/spending-overview
- assertVisible:
    id: spending-budget-left
- assertVisible: Breakdown
- scrollUntilVisible:
    element:
      id: spending-breakdown-circle
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: spending-breakdown-circle
- assertVisible:
    id: spending-breakdown-segment-categories-selected
- tapOn:
    id: spending-breakdown-segment-tags
- assertVisible:
    id: spending-breakdown-segment-tags-selected
- assertVisible:
    id: spending-breakdown-tags-list
- assertVisible:
    id: spending-breakdown-tag-row-0
- tapOn:
    id: spending-breakdown-tag-row-0
- assertVisible:
    id: tag-detail-screen
- openLink:
    link: darkfinances:///spending
- runFlow:
    when:
      visible: 'Open in "Finances"'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: spending-screen
- takeScreenshot: build/maestro/screenshots/spending-budget-breakdown
- scroll
- assertVisible: Largest Purchases
- scroll
- assertVisible: Non-Spending
- takeScreenshot: build/maestro/screenshots/spending-lower-sections
