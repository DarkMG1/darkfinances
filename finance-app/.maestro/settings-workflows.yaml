- assertVisible:
    id: settings-screen
- tapOn:
    id: settings-test-connection-button
- assertVisible:
    id: settings-screen
- assertVisible:
    id: settings-demo-mode-switch
- assertVisible:
    id: settings-face-id-switch
- scroll
- assertVisible:
    id: settings-dashboard-accounts-switch
- tapOn:
    id: settings-dashboard-accounts-switch
- tapOn:
    id: settings-dashboard-accounts-switch
- assertVisible:
    id: settings-rules-row
- assertVisible:
