appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink: darkfinances:///category/Bills%20%26%20Utilities?bucket=bills
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: category-detail-screen
- assertVisible: Bills & Utilities
- assertVisible: Transactions
- assertVisible:
    id: category-transaction-row-0
- takeScreenshot: build/maestro/screenshots/bills-utilities-drilldown
