appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink:
    link: darkfinances:///category/Bills%20%26%20Utilities?bucket=bills
- runFlow:
    when:
      visible: 'Open in "Finances"'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: category-detail-screen
- assertVisible: Bills & Utilities
- assertVisible: Transactions
- assertVisible:
    id: category-transaction-row-0
- takeScreenshot: build/maestro/screenshots/bills-utilities-drilldown
