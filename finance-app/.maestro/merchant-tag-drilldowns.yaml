appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink: darkfinances:///merchant/Amazon
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: merchant-detail-screen
- assertVisible:
    id: merchant-range-1y-selected
- tapOn:
    id: merchant-range-6m
- assertVisible:
    id: merchant-range-6m-selected
- assertVisible: Amazon
- openLink: darkfinances:///tag/alex
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: tag-detail-screen
- assertVisible:
    id: tag-detail-screen
