appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink: darkfinances:///transactions
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: activity-screen
- tapOn:
    id: activity-add-transaction-button
- assertVisible:
    id: add-transaction-screen
- tapOn:
    id: add-transaction-submit-button
- assertVisible:
    id: add-transaction-amount-error
- inputText: "12.50"
- tapOn:
    id: add-transaction-date-input
- eraseText
- inputText: "2026-02-30"
- tapOn:
    id: add-transaction-submit-button
- assertVisible:
    id: add-transaction-date-error
