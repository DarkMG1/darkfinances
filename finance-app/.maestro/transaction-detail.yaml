appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- tapOn:
    id: spending-tab
- assertVisible:
    id: spending-screen
- tapOn:
    id: spending-total-row
- tapOn:
    id: spending-summary-spending-row
- assertVisible:
    id: category-detail-screen
- tapOn:
    id: category-transaction-row-0
- assertVisible:
    id: transaction-detail-screen
- assertVisible:
    id: transaction-date-button
- assertVisible:
    id: transaction-category-pill
- assertVisible:
    id: transaction-action-menu
- assertVisible:
    id: transaction-secondary-menu
- assertVisible:
    id: transaction-tags-row
- assertVisible:
    id: transaction-notes-row
- assertVisible:
    id: transaction-split-row
- takeScreenshot: build/maestro/screenshots/transaction-detail
