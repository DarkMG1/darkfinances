appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- assertVisible:
    id: home-networth-hero
- assertVisible:
    id: home-review-banner
- tapOn:
    id: home-review-banner
- assertVisible:
    id: review-screen
- openLink:
    link: darkfinances:///
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: home-screen
- scroll
- assertVisible:
    id: home-stat-spent
- assertVisible:
    id: home-stat-income
- assertVisible:
    id: home-stat-net
- assertVisible:
    id: home-action-cash-flow
- assertVisible:
    id: home-action-budgets
- assertVisible:
    id: home-action-goals
- assertVisible:
    id: home-action-who-owes-me
- assertNotVisible:
    id: home-action-reports
    optional: true
- scroll
- assertVisible:
    id: home-account-acc-check
- tapOn:
    id: home-account-acc-check
- assertVisible:
    id: account-detail-screen
- openLink:
    link: darkfinances:///
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- scroll
- assertVisible:
    id: home-sync-button
- tapOn:
    id: home-sync-button
- assertVisible:
    id: home-screen
