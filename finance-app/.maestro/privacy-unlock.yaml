appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- tapOn:
    id: settings-tab
- assertVisible:
    id: settings-screen
- tapOn:
    id: settings-face-id-switch
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- tapOn:
    id: home-tab
- assertVisible:
    id: home-screen
- pressKey: HOME
- waitForAnimationToEnd
- launchApp
- assertVisible:
    id: privacy-lock-overlay
- extendedWaitUntil:
    notVisible:
      id: privacy-lock-overlay
    timeout: 8000
- assertVisible:
    id: home-screen
