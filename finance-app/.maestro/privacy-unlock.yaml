appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- openLink: darkfinances:///settings
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: settings-screen
- tapOn:
    id: settings-face-id-switch
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- openLink: darkfinances:///
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: home-screen
- pressKey: HOME
- waitForAnimationToEnd
- launchApp
- assertVisible:
    id: privacy-lock-overlay
- extendedWaitUntil:
    notVisible:
      id: privacy-lock-overlay
    timeout: 8000
- assertVisible:
    id: home-screen
