appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- tapOn:
    id: activity-tab
- assertVisible:
    id: activity-screen
- assertNotVisible:
    id: activity-refetch-banner
    optional: true
- assertVisible:
    id: activity-filter-all-selected
- tapOn:
    id: activity-filter-expense
- assertVisible:
    id: activity-filter-expense-selected
- tapOn:
    id: activity-filter-income
- assertVisible:
    id: activity-filter-income-selected
- tapOn:
    id: activity-filter-all
- assertVisible:
    id: activity-filter-all-selected
- tapOn:
    id: activity-range-6m
- assertVisible:
    id: activity-range-6m-selected
- tapOn:
    id: activity-uncategorized
- assertVisible:
    id: activity-uncategorized-selected
- tapOn:
    id: activity-uncategorized-selected
- tapOn:
    id: activity-tab
- tapOn:
    id: activity-search-input
- inputText: Amazon
- assertVisible:
    id: activity-screen
- eraseText
- tapOn:
    point: 50%,20%
- tapOn:
    id: activity-transaction-tx-1
    optional: true
- assertVisible:
    id: transaction-detail-screen
    optional: true
- openLink:
    link: darkfinances:///transactions
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: activity-screen
- tapOn:
    id: activity-add-transaction-button
- assertVisible:
    id: add-transaction-screen
- openLink:
    link: darkfinances:///transactions
- runFlow:
    when:
      visible: 'Open in ["“]Finances["”].*'
    commands:
      - tapOn:
          text: Open
- tapOn:
    id: activity-export-button
