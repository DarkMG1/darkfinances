- assertVisible:
    id: home-screen
- openLink:
    link: darkfinances:///budgets
- runFlow:
    when:
      visible: 'Open in "Finances"'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: budgets-screen
- assertVisible:
    id: budgets-screen
- openLink:
    link: darkfinances:///cashflow
- runFlow:
    when:
      visible: 'Open in "Finances"'
    commands:
      - tapOn:
          text: Open
- assertVisible:
    id: cashflow-screen
- assertVisible:
    id: cashflow-money-in
- tapOn:
    id: cashflow-forecast-link
- assertVisible:
    id: forecast-screen
- assertVisible:
    id: forecast-range-90-selected
- tapOn:
    id: forecast-range-30
- assertVisible:
    id: forecast-range-30-selected
- assertVisible:
    id: forecast-event-0
- openLink:
