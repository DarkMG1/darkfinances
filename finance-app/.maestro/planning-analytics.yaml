- assertVisible:
    id: networth-range-1y-selected
- tapOn:
    id: networth-range-3m
- assertVisible:
    id: networth-range-3m-selected
- assertVisible:
    id: networth-investments-link
- tapOn:
    id: networth-investments-link
- assertVisible:
    id: investments-screen
- assertVisible:
    id: investments-holding-VTI
- openLink:
