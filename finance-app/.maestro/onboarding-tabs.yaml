appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
- assertVisible: Connect to your server
- tapOn:
    id: onboarding-connect-button
- assertVisible: Enter both server URL and token
- tapOn:
    id: onboarding-demo-button
- assertVisible:
    id: home-screen
- assertVisible:
    id: home-networth-hero
- tapOn:
    id: spending-tab
- assertVisible:
    id: spending-screen
- tapOn:
    id: activity-tab
- assertVisible:
    id: activity-screen
- tapOn:
    id: settings-tab
- assertVisible:
    id: settings-screen
