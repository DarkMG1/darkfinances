- openLink: darkfinances:///transaction/tx-60?payee=Amazon&amount=-64.3&date=2026-06-29&accountId=acc-credit&category=Shopping&categoryId=cat-shopping&isLeg=0&parentId=&cleared=1&imported=1
- tapOn:
    text: Open
