- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: transaction-detail-screen
- tapOn:
    id: transaction-date-button
- assertVisible:
    id: transaction-date-sheet
- assertVisible:
    id: transaction-date-today-button
- tapOn:
    id: transaction-date-done-button
- tapOn:
    id: transaction-category-pill
- assertVisible:
    id: transaction-category-sheet
- tapOn:
