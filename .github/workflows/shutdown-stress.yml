name: Shutdown stress

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shutdown-stress
  cancel-in-progress: true

jobs:
  bounded-stress:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/ensure-declared-npm.js
      - run: npm ci
      - name: Supply-chain preflight (pinned actions + vulnerability gate)
        run: |
          npm run check:action-pins:upstream
          npm run check:vulnerabilities
      - name: Bounded graceful-shutdown stress
        env:
          FINANCE_QUERY_SHUTDOWN_STRESS: '1'
          FINANCE_QUERY_SHUTDOWN_STRESS_SERIAL: '25'
          FINANCE_QUERY_SHUTDOWN_STRESS_PARALLEL: '25'
          FINANCE_QUERY_SHUTDOWN_STRESS_WORKERS: '4'
        run: npm run check:shutdown-stress
