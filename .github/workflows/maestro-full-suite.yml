name: Maestro full suite

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-full-suite
  cancel-in-progress: true

jobs:
  # Expo SDK 56 needs Swift 6.3, but RN 0.85 UI is absent from XCUITest on
  # iOS 26 (react-native#57282). Build with Xcode 26.4, then test on iOS 18.5.
  maestro-ios-build:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Verify pinned build toolchain
        run: |
          test "$(uname -m)" = arm64
          expected=$'Xcode 26.4.1\nBuild version 17E202'
          actual="$(xcodebuild -version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected Xcode toolchain:\n%s\n' "$actual" >&2
            exit 1
          fi
          swift_version="$(xcrun swift --version)"
          if [[ "$swift_version" != "Apple Swift version 6.3"* ]]; then
            printf 'unexpected Swift toolchain:\n%s\n' "$swift_version" >&2
            exit 1
          fi
      - run: node scripts/ensure-declared-npm.js
      - run: npm ci
      - name: Supply-chain preflight (pinned actions + vulnerability gate)
        run: |
          npm run check:action-pins:upstream
          npm run check:vulnerabilities
      - name: Verify pinned CocoaPods CLI
        run: bash scripts/ensure-cocoapods.sh
      - name: Build and package iOS simulator app
        working-directory: finance-app
        env:
          EXPO_PUBLIC_FINANCE_DEMO_URL: http://127.0.0.1:5007
        run: |
          mkdir -p build
          expo_bin="$(node scripts/resolve-expo-bin.js)"
          "$expo_bin" prebuild -p ios --clean
          derived_data="$PWD/build/ios-simulator-derived-data"
          xcodebuild \
            -workspace ios/Finances.xcworkspace \
            -scheme Finances \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
          app_path="$derived_data/Build/Products/Debug-iphonesimulator/Finances.app"
          test -d "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          test -x "$app_path/$executable"
          COPYFILE_DISABLE=1 tar -czf build/ios-simulator-app.tgz \
            -C "$(dirname "$app_path")" "$(basename "$app_path")"
          (
            cd build
            shasum -a 256 ios-simulator-app.tgz > ios-simulator-app.tgz.sha256
          )
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-ios-app-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: |
            finance-app/build/ios-simulator-app.tgz
            finance-app/build/ios-simulator-app.tgz.sha256

  maestro-ios:
    needs: maestro-ios-build
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Verify pinned simulator toolchain
        run: |
          test "$(uname -m)" = arm64
          expected=$'Xcode 16.4\nBuild version 16F6'
          actual="$(xcodebuild -version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected Xcode toolchain:\n%s\n' "$actual" >&2
            exit 1
          fi
      - run: node scripts/ensure-declared-npm.js
      - run: npm ci
      - name: Supply-chain preflight (pinned actions + vulnerability gate)
        run: |
          npm run check:action-pins:upstream
          npm run check:vulnerabilities
      - name: Download iOS simulator app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maestro-ios-app-${{ github.run_id }}
          path: finance-app/build/ios-simulator-artifact
      - name: Verify and extract iOS simulator app
        working-directory: finance-app
        run: |
          artifact_dir="$PWD/build/ios-simulator-artifact"
          (
            cd "$artifact_dir"
            shasum -a 256 -c ios-simulator-app.tgz.sha256
          )
          mkdir -p build/ios-simulator-app
          tar -xzf "$artifact_dir/ios-simulator-app.tgz" -C build/ios-simulator-app
          app_path="$PWD/build/ios-simulator-app/Finances.app"
          test -d "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          test -x "$app_path/$executable"
          test "$(lipo -archs "$app_path/$executable")" = arm64
      - name: Select and boot iOS 18.5 simulator
        id: simulator
        env:
          IOS_SIMULATOR_RUNTIME: '18.5'
        run: node scripts/ci-ios-simulator.js
      - name: Verify selected iOS runtime
        env:
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: test "$SIMULATOR_RUNTIME" = com.apple.CoreSimulator.SimRuntime.iOS-18-5
      - name: Bootstrap pinned Maestro
        id: maestro
        run: |
          maestro_bin="$(bash scripts/ensure-maestro.sh)"
          maestro_dir="$(dirname "$maestro_bin")"
          echo "bin=$maestro_bin" >> "$GITHUB_OUTPUT"
          echo "dir=$maestro_dir" >> "$GITHUB_OUTPUT"
          echo "$maestro_dir" >> "$GITHUB_PATH"
          "$maestro_bin" --version
      - name: Start synthetic DEMO_ONLY dashboard
        run: |
          mkdir -p finance-app/build
          DEMO_ONLY=1 NODE_ENV=test ALLOW_RAW_ACTUAL_API=1 PORT=5007 node finance-dashboard/server.js > finance-app/build/ci-demo-dashboard.log 2>&1 &
          echo $! > finance-app/build/ci-demo-dashboard.pid
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'X-Demo-Mode: 1' 'http://127.0.0.1:5007/api/v1/ping' | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          echo "demo dashboard failed to become ready" >&2
          exit 1
      - name: Start Expo Metro for Debug build
        working-directory: finance-app
        env:
          CI: '1'
          EXPO_PUBLIC_FINANCE_DEMO_URL: http://127.0.0.1:5007
        run: |
          expo_bin="$(node scripts/resolve-expo-bin.js)"
          "$expo_bin" start --dev-client --port 8081 > build/ci-metro.log 2>&1 &
          echo $! > build/ci-metro.pid
          for attempt in $(seq 1 90); do
            if curl -fsS 'http://127.0.0.1:8081/status' | grep -q 'packager-status:running'; then
              exit 0
            fi
            sleep 2
          done
          echo "Expo Metro failed to become ready" >&2
          exit 1
      - name: Install and warm iOS simulator app
        working-directory: finance-app
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          app_path="$PWD/build/ios-simulator-app/Finances.app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$app_path"
          xcrun simctl launch "$DEVICE" "$bundle_id"
          for attempt in $(seq 1 90); do
            if grep -q 'iOS Bundled' build/ci-metro.log; then
              exit 0
            fi
            sleep 2
          done
          echo "iOS app failed to request a Metro bundle" >&2
          exit 1
      - name: Run full Maestro suite
        working-directory: finance-app
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: bash scripts/run-maestro-ios.sh .maestro
      - name: Capture simulator failure state
        if: failure()
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          mkdir -p finance-app/build/maestro
          if [ -n "$DEVICE" ]; then
            xcrun simctl io "$DEVICE" screenshot \
              finance-app/build/maestro/simulator-failure.png || true
          fi
      - name: Upload sanitized failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-full-suite-failure-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            finance-app/build/maestro/**
            finance-app/build/ci-demo-dashboard.log
            finance-app/build/ci-metro.log
      - name: Stop demo dashboard and Metro
        if: always()
        run: |
          for pid_file in finance-app/build/ci-demo-dashboard.pid finance-app/build/ci-metro.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" || true
            fi
          done
